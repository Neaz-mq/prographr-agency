<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prographr — Crafting Digital Experiences</title>
    <meta name="description" content="Prographr is a creative agency specializing in Graphic Design, Web Design, Website Development, and PowerPoint Design." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />

    <script>
      (function () {
        document.querySelectorAll("link[rel*='icon']").forEach((el) => el.remove());

        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");

        const img = new Image();
        img.src = "/logo.webp?v=" + Date.now();
        img.onload = function () {
          ctx.fillStyle = "#182F33";
          ctx.fillRect(0, 0, 64, 64);

          const padding = 8;
          ctx.drawImage(img, padding, padding, 64 - padding * 2, 64 - padding * 2);

          const link = document.createElement("link");
          link.rel = "shortcut icon";
          link.type = "image/png";
          link.href = canvas.toDataURL("image/png");
          document.head.appendChild(link);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
